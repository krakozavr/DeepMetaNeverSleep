<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepMeta Never Sleep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header>
      <img src="icons/icon-48-waiting.png" alt="" width="32" height="32">
      <div>
        <h1>DeepMeta Never Sleep</h1>
        <p>Settings</p>
      </div>
    </header>

    <label class="setting">
      <span>
        <strong>Prevent sleep during uploads</strong>
        <small>Keep the computer awake while DeepMeta uploads are active.</small>
      </span>
      <input type="checkbox" id="preventSleepActiveUploads">
    </label>

    <label class="setting">
      <span>
        <strong>Restore search results</strong>
        <small>Return to the same search-filtered batch list.</small>
      </span>
      <input type="checkbox" id="restoreSearchResults">
    </label>

    <label class="setting">
      <span>
        <strong>Restore batch position</strong>
        <small>Scroll back to the opened batch and keep it highlighted.</small>
      </span>
      <input type="checkbox" id="restoreBatchPosition">
    </label>

    <div class="section-divider"></div>

    <div class="section-header">
      <strong>Google Tasks</strong>
      <small>Create a task when you like a brief.</small>
    </div>

    <div id="tasksNotConnected">
      <button type="button" id="btnConnect" class="btn-action">Connect Google Account</button>
    </div>

    <div id="tasksConnected" hidden>
      <button type="button" id="btnDisconnect" class="btn-action btn-action--secondary">Disconnect</button>

      <label class="setting setting--select">
        <span>
          <strong>CC briefs list</strong>
        </span>
        <select id="ccListSelect">
          <option value="">Select list…</option>
        </select>
      </label>

      <label class="setting setting--select">
        <span>
          <strong>Creative briefs list</strong>
        </span>
        <select id="creativeListSelect">
          <option value="">Select list…</option>
        </select>
      </label>
    </div>

    <p class="status" id="status" role="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
